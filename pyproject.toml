[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshelf"
version = "0.1.0"
description = "个人书架管理 CLI - Git 工作流练习项目"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bookshelf = "bookshelf.cli:main"

[tool.setuptools.packages.find]
include = ["bookshelf*"]
